<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1"
    <title>Tables</title>
</head>

<body>

<table border="1"
    cellspacing="0"
    cellpadding="40px",width="400px",height="400px">

    <!-- ROW 1 -->
    <tr>
        <td></td>

        <td colspan="2"></td>

        <td></td>

        <td></td>
        
    </tr>

    <!-- ROW 2 -->
    <tr>
        <td></td>

        <td rowspan="2"></td>

        <td></td>

        <td colspan="2"></td>
    </tr>

    <!-- ROW 3 -->
    <tr>
        <td></td>

        <td rowspan="2"></td>
        

        <td colspan="2" rowspan="2">

            <!-- INNER TABLE -->
            <table border="2"
                   cellspacing="0"
                   cellpadding="40px" , width="200px",height="200px">

                <!-- INNER ROW 1 -->
                <tr>
                    <td rowspan="2"></td>

                    <td colspan="2"></td>
                </tr>

                <!-- INNER ROW 2 -->
                <tr>
                    <td></td>
                    <td></td>
                </tr>

                <!-- INNER ROW 3 -->
                <tr>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>

                <!-- INNER ROW 4 -->
                <tr>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>

            </table>

        </td>
    </tr>

     <tr>
        <td></td>

        <td></td>

    

        
    </tr>

</table>

</body>
</html>
